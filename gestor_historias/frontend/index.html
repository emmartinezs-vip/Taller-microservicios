<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gestor de Historias de Usuario</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- Contenedor principal: agrupa la barra lateral y el contenido -->
  <div class="contenedor_app">

    <!-- BARRA LATERAL DE NAVEGACIÓN -->
    <aside class="barra_lateral">

      <!-- Encabezado: logo y nombre de la app -->
      <div class="barra_lateral_encabezado">
        <div class="barra_lateral_logo">GH</div>
        <span class="barra_lateral_nombre">Gestor <span>HU</span></span>
      </div>

      <!-- Enlaces de navegación -->
      <nav class="barra_lateral_nav">
        <a href="index.html" class="enlace_nav activo">Dashboard</a>
        <a href="paginas/sprints.html" class="enlace_nav">Sprints</a>
        <a href="paginas/historias.html" class="enlace_nav">Historias</a>
        <a href="paginas/responsables.html" class="enlace_nav">Responsables</a>
        <a href="paginas/reportes.html" class="enlace_nav">Reportes</a>
      </nav>

    </aside>

    <!-- CONTENIDO PRINCIPAL -->
    <div class="contenido_principal">

      <!-- Barra superior: título de la página -->
      <div class="barra_superior">
        <h1>Dashboard</h1>
        <p>Resumen general del proyecto</p>
      </div>

      <!-- Cuerpo de la página -->
      <div class="cuerpo_pagina">

        <!-- Tarjetas de estadísticas -->
        <div class="grilla_estadisticas">

          <div class="tarjeta tarjeta_estadistica">
            <div class="etiqueta_estadistica">Sprints activos</div>
            <div class="valor_estadistica verde" id="stat_sprints">—</div>
          </div>

          <div class="tarjeta tarjeta_estadistica">
            <div class="etiqueta_estadistica">Total historias</div>
            <div class="valor_estadistica azul" id="stat_historias">—</div>
          </div>

          <div class="tarjeta tarjeta_estadistica">
            <div class="etiqueta_estadistica">Finalizadas</div>
            <div class="valor_estadistica morado" id="stat_finalizadas">—</div>
          </div>

          <div class="tarjeta tarjeta_estadistica">
            <div class="etiqueta_estadistica">Impedimentos</div>
            <div class="valor_estadistica rojo" id="stat_impedimentos">—</div>
          </div>

        </div>

        <!-- Sección de historias recientes -->
        <div class="encabezado_seccion">
          <span class="titulo_seccion">Historias recientes</span>
        </div>

        <!-- Aquí JavaScript insertará las tarjetas de historias -->
        <div class="grilla_historias" id="historias_recientes">
          <p class="texto_tenue">Cargando...</p>
        </div>

      </div><!-- cierra cuerpo_pagina -->
    </div><!-- cierra contenido_principal -->

  </div><!-- cierra contenedor_app -->

  <!-- Scripts: api.js primero porque app.js lo necesita -->
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>

</body>
</html>
